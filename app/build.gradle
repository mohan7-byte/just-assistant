plugins { id 'com.android.application' }

android {
    namespace 'com.mohan7byte.justassistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mohan7byte.justassistant'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        stableDebug {
            storeFile file('../signing/stable-debug.keystore')
            storePassword 'justassistant'
            keyAlias 'justassistant'
            keyPassword 'justassistant'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
        }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
}
