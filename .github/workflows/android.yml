name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.13
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Restore stable debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: signing/stable-debug.keystore
          key: just-assistant-debug-keystore-v1

      - name: Create stable debug signing key
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p signing
          keytool -genkeypair -v             -keystore signing/stable-debug.keystore             -storepass justassistant             -keypass justassistant             -alias justassistant             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Just Assistant Debug,O=Just Assistant,C=IN"

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: just-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
